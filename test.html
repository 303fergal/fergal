<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Metal — Self-built Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020203; height:100vh; overflow:hidden; }
  .stage { position:relative; width:100%; height:100vh; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  .overlay{
    position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 25%, rgba(2,2,3,0.5) 90%);
  }
  .title{
    font-family:Georgia, serif; font-weight:700; font-size:clamp(48px,9vw,110px);
    color:#f2f2f4; letter-spacing:.02em;
  }
  .note{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-family:-apple-system,sans-serif; font-size:11px; color:#5a5f78; z-index:5; text-align:center;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="chromeCanvas"></canvas>
  <div class="overlay">
    <div class="title">303FERGAL</div>
  </div>
  <div class="note">Self-built canvas — navy / silver / black, metallic detail</div>
</div>

<script>
const canvas = document.getElementById('chromeCanvas');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resize();
window.addEventListener('resize', resize);

const blobs = Array.from({length: 8}, () => ({
  r: 0.11 + Math.random() * 0.09,
  phase: Math.random() * Math.PI * 2,
  speedX: 0.00004 + Math.random() * 0.00003,
  speedY: 0.00004 + Math.random() * 0.00003,
  orbit: 0.55 + Math.random() * 0.25
}));

const silhouette = document.createElement('canvas');
const silCtx = silhouette.getContext('2d');
const raw = document.createElement('canvas');
const rawCtx = raw.getContext('2d');

// generate a static fine-grain noise tile once (brushed metal texture)
const noiseTile = document.createElement('canvas');
noiseTile.width = 160; noiseTile.height = 160;
const noiseCtx = noiseTile.getContext('2d');
const noiseImg = noiseCtx.createImageData(160,160);
for (let i = 0; i < noiseImg.data.length; i += 4) {
  const v = 128 + (Math.random() - 0.5) * 90;
  noiseImg.data[i] = v; noiseImg.data[i+1] = v; noiseImg.data[i+2] = v; noiseImg.data[i+3] = 255;
}
noiseCtx.putImageData(noiseImg, 0, 0);
let noisePattern = null;

function draw(t){
  const w = canvas.width, h = canvas.height;
  if (w === 0 || h === 0){ requestAnimationFrame(draw); return; }
  silhouette.width = w; silhouette.height = h;
  raw.width = w; raw.height = h;

  // 1) draw blobs additively (raw field)
  rawCtx.clearRect(0,0,w,h);
  rawCtx.globalCompositeOperation = 'lighter';
  blobs.forEach(b => {
    const cx = (0.5 + b.orbit * 0.5 * Math.sin(t*b.speedX + b.phase)) * w;
    const cy = (0.5 + b.orbit * 0.5 * Math.cos(t*b.speedY + b.phase*1.3)) * h;
    const r = b.r * Math.min(w,h);
    const g = rawCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    rawCtx.fillStyle = g;
    rawCtx.beginPath(); rawCtx.arc(cx,cy,r,0,Math.PI*2); rawCtx.fill();
  });

  // 2) goo merge into silhouette
  silCtx.clearRect(0,0,w,h);
  silCtx.filter = 'blur(15px) contrast(30)';
  silCtx.drawImage(raw,0,0);
  silCtx.filter = 'none';

  // 3) base backdrop (navy/black)
  const bg = ctx.createRadialGradient(w*0.5,h*0.4,0,w*0.5,h*0.4,Math.max(w,h)*0.75);
  bg.addColorStop(0,'#141c33');
  bg.addColorStop(0.5,'#06070c');
  bg.addColorStop(1,'#020203');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  // 4) chromatic-edge pass: draw silhouette 3x, slightly offset + tinted, blended with screen
  ctx.globalCompositeOperation = 'screen';
  const off = 1.6 + Math.sin(t*0.0006)*0.6;

  ctx.globalAlpha = 0.55;
  ctx.filter = 'sepia(1) saturate(6) hue-rotate(-30deg) brightness(1.1)'; // warm red-ish fringe
  ctx.drawImage(silhouette, -off, -off*0.6);
  ctx.filter = 'none';

  ctx.filter = 'sepia(1) saturate(6) hue-rotate(160deg) brightness(1.1)'; // cool blue-ish fringe
  ctx.drawImage(silhouette, off, off*0.6);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;

  // 5) colorize main silhouette with metallic navy/silver/black gradient
  ctx.globalCompositeOperation = 'source-over';
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = w; maskCanvas.height = h;
  const maskCtx = maskCanvas.getContext('2d');
  maskCtx.drawImage(silhouette, 0, 0);
  maskCtx.globalCompositeOperation = 'source-atop';
  const angle = (t * 0.00004) % (Math.PI*2);
  const dx = Math.cos(angle)*w, dy = Math.sin(angle)*h;
  const metal = maskCtx.createLinearGradient(w/2-dx, h/2-dy, w/2+dx, h/2+dy);
  metal.addColorStop(0.00,'#f8f8fa');
  metal.addColorStop(0.10,'#c3c7d4');
  metal.addColorStop(0.22,'#5a5f75');
  metal.addColorStop(0.34,'#171a28');
  metal.addColorStop(0.44,'#f0f1f4');
  metal.addColorStop(0.50,'#0c0e18');
  metal.addColorStop(0.56,'#f0f1f4');
  metal.addColorStop(0.66,'#171a28');
  metal.addColorStop(0.78,'#5a5f75');
  metal.addColorStop(0.90,'#c3c7d4');
  metal.addColorStop(1.00,'#f8f8fa');
  maskCtx.fillStyle = metal;
  maskCtx.fillRect(0,0,w,h);
  ctx.drawImage(maskCanvas, 0, 0);

  // 5b) rim light — bright thin edge ring, classic metal fresnel look
  const inner = document.createElement('canvas');
  inner.width = w; inner.height = h;
  const innerCtx = inner.getContext('2d');
  innerCtx.globalCompositeOperation = 'lighter';
  blobs.forEach(b => {
    const cx = (0.5 + b.orbit * 0.5 * Math.sin(t*b.speedX + b.phase)) * w;
    const cy = (0.5 + b.orbit * 0.5 * Math.cos(t*b.speedY + b.phase*1.3)) * h;
    const r = b.r * 0.86 * Math.min(w,h);
    const g = innerCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    innerCtx.fillStyle = g;
    innerCtx.beginPath(); innerCtx.arc(cx,cy,r,0,Math.PI*2); innerCtx.fill();
  });
  innerCtx.filter = 'blur(15px) contrast(30)';
  innerCtx.globalCompositeOperation = 'source-over';
  innerCtx.drawImage(inner, 0, 0);
  innerCtx.filter = 'none';

  const rim = document.createElement('canvas');
  rim.width = w; rim.height = h;
  const rimCtx = rim.getContext('2d');
  rimCtx.drawImage(silhouette, 0, 0);
  rimCtx.globalCompositeOperation = 'destination-out';
  rimCtx.drawImage(inner, 0, 0);
  rimCtx.globalCompositeOperation = 'source-in';
  rimCtx.fillStyle = 'rgba(240,244,255,0.9)';
  rimCtx.fillRect(0,0,w,h);

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(rim, 0, 0);

  // 5c) tight specular hotspot following the lead blob
  const hb = blobs[0];
  const hx = (0.5 + hb.orbit * 0.5 * Math.sin(t*hb.speedX + hb.phase)) * w;
  const hy = (0.5 + hb.orbit * 0.5 * Math.cos(t*hb.speedY + hb.phase*1.3)) * h - hb.r*Math.min(w,h)*0.3;
  const hotspot = ctx.createRadialGradient(hx, hy, 0, hx, hy, hb.r*Math.min(w,h)*0.35);
  hotspot.addColorStop(0, 'rgba(255,255,255,0.9)');
  hotspot.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  hotspot.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hotspot;
  ctx.fillRect(0,0,w,h);

  // 6) moving specular sheen streak
  ctx.globalCompositeOperation = 'screen';
  const sheenX = (0.5 + 0.5*Math.sin(t*0.0003)) * w;
  const sheen = ctx.createRadialGradient(sheenX, h*0.3, 0, sheenX, h*0.3, w*0.35);
  sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0,0,w,h);

  // 7) secondary cross-angle gradient — crossing reflection bands, masked to silhouette only
  const crossMask = document.createElement('canvas');
  crossMask.width = w; crossMask.height = h;
  const crossCtx = crossMask.getContext('2d');
  crossCtx.drawImage(silhouette, 0, 0);
  crossCtx.globalCompositeOperation = 'source-atop';
  const angle2 = angle + Math.PI/2.3;
  const dx2 = Math.cos(angle2)*w, dy2 = Math.sin(angle2)*h;
  const cross = crossCtx.createLinearGradient(w/2-dx2, h/2-dy2, w/2+dx2, h/2+dy2);
  cross.addColorStop(0.0, 'rgba(255,255,255,0)');
  cross.addColorStop(0.28,'rgba(255,255,255,0.16)');
  cross.addColorStop(0.5, 'rgba(0,0,0,0.14)');
  cross.addColorStop(0.72,'rgba(255,255,255,0.16)');
  cross.addColorStop(1.0, 'rgba(255,255,255,0)');
  crossCtx.fillStyle = cross;
  crossCtx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(crossMask, 0, 0);

  // 8) fine brushed-metal grain, masked to silhouette only
  if (!noisePattern) noisePattern = ctx.createPattern(noiseTile, 'repeat');
  const grainMask = document.createElement('canvas');
  grainMask.width = w; grainMask.height = h;
  const grainCtx = grainMask.getContext('2d');
  grainCtx.drawImage(silhouette, 0, 0);
  grainCtx.globalCompositeOperation = 'source-atop';
  grainCtx.fillStyle = noisePattern;
  grainCtx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.5;
  ctx.drawImage(grainMask, 0, 0);
  ctx.globalAlpha = 1;

  // 9) final contrast/brightness boost for a heavier metallic punch
  const snapshot = document.createElement('canvas');
  snapshot.width = w; snapshot.height = h;
  snapshot.getContext('2d').drawImage(canvas, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.filter = 'contrast(1.1) saturate(1.05) brightness(1.02)';
  ctx.drawImage(snapshot, 0, 0);
  ctx.filter = 'none';

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
