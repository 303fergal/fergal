<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303FERGAL — Background Test</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #020305;
}

/* =====================================================
   METALLIC IMAGE BACKGROUND
   ===================================================== */

.metal-background {
    position: fixed;
    inset: 0;

    background-image:
        url("Assets/metal-background.jpeg");

    background-size: cover;
    background-position: center;

    transform: scale(1.04);

    z-index: 0;
}

/* =====================================================
   DARK METALLIC OVERLAY
   ===================================================== */

.metal-background::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            transparent 15%,
            rgba(0,0,0,.18) 55%,
            rgba(0,0,0,.65) 100%
        );

    pointer-events: none;
}


/* =====================================================
   MOVING METALLIC BLOBS
   ===================================================== */

.blob {
    position: absolute;

    border-radius:
        60% 40% 55% 45% /
        45% 60% 40% 55%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.35),
            rgba(180,185,195,.20) 18%,
            rgba(30,35,45,.30) 48%,
            rgba(0,0,0,.65) 75%
        );

    filter: blur(35px);

    mix-blend-mode: screen;

    opacity: .55;

    pointer-events: none;

    will-change: transform;
}


/* =====================================================
   BLOB 1
   ===================================================== */

.blob-1 {
    width: 65vw;
    height: 45vw;

    left: -20vw;
    top: 5vh;

    animation:
        blobOne 18s ease-in-out infinite alternate;
}


/* =====================================================
   BLOB 2
   ===================================================== */

.blob-2 {
    width: 55vw;
    height: 60vw;

    right: -15vw;
    top: 10vh;

    opacity: .45;

    animation:
        blobTwo 24s ease-in-out infinite alternate;
}


/* =====================================================
   BLOB 3
   ===================================================== */

.blob-3 {
    width: 70vw;
    height: 35vw;

    left: 15vw;
    bottom: -15vh;

    opacity: .35;

    animation:
        blobThree 27s ease-in-out infinite alternate;
}


/* =====================================================
   SMOKE
   ===================================================== */

.smoke {
    position: absolute;

    width: 90vw;
    height: 35vw;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.14) 0%,
            rgba(180,185,195,.08) 25%,
            rgba(80,85,95,.04) 50%,
            transparent 75%
        );

    filter: blur(60px);

    mix-blend-mode: screen;

    opacity: .55;

    pointer-events: none;
}


/* =====================================================
   SMOKE 1
   ===================================================== */

.smoke-1 {
    left: -25vw;
    top: 20vh;

    transform: rotate(-20deg);

    animation:
        smokeOne 30s ease-in-out infinite alternate;
}


/* =====================================================
   SMOKE 2
   ===================================================== */

.smoke-2 {
    right: -30vw;
    bottom: 15vh;

    transform: rotate(25deg);

    opacity: .4;

    animation:
        smokeTwo 35s ease-in-out infinite alternate;
}


/* =====================================================
   ANIMATIONS
   ===================================================== */

@keyframes blobOne {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
    }

    50% {
        transform:
            translate3d(18vw,8vh,0)
            rotate(15deg)
            scale(1.15);
    }

    100% {
        transform:
            translate3d(5vw,20vh,0)
            rotate(30deg)
            scale(.95);
    }
}


@keyframes blobTwo {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
    }

    50% {
        transform:
            translate3d(-15vw,10vh,0)
            rotate(-20deg)
            scale(1.2);
    }

    100% {
        transform:
            translate3d(-5vw,-10vh,0)
            rotate(15deg)
            scale(.9);
    }
}


@keyframes blobThree {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
    }

    50% {
        transform:
            translate3d(-15vw,-10vh,0)
            rotate(-15deg)
            scale(1.2);
    }

    100% {
        transform:
            translate3d(15vw,-5vh,0)
            rotate(20deg)
            scale(.9);
    }
}


@keyframes smokeOne {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(-20deg)
            scale(1);
    }

    100% {
        transform:
            translate3d(30vw,10vh,0)
            rotate(5deg)
            scale(1.4);
    }
}


@keyframes smokeTwo {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(25deg)
            scale(1);
    }

    100% {
        transform:
            translate3d(-25vw,-15vh,0)
            rotate(40deg)
            scale(1.35);
    }
}


/* =====================================================
   VIGNETTE
   ===================================================== */

.vignette {
    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.2) 65%,
            rgba(0,0,0,.7) 100%
        );

    z-index: 5;

    pointer-events: none;
}


/* =====================================================
   TEST TEXT
   ===================================================== */

.hero-content {
    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;

    pointer-events: none;
}

.hero-title {
    margin: 0;

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(50px, 12vw, 150px);

    letter-spacing: -.04em;

    text-shadow:
        0 4px 30px rgba(0,0,0,.65),
        0 0 50px rgba(255,255,255,.08);
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .metal-background {
        background-position: center;
        transform: scale(1.08);
    }

    .blob {
        filter: blur(30px);
    }

    .blob-1 {
        width: 100vw;
        height: 70vw;
    }

    .blob-2 {
        width: 90vw;
        height: 100vw;
    }

    .blob-3 {
        width: 110vw;
        height: 55vw;
    }

    .smoke {
        width: 130vw;
        height: 50vw;
    }

    .hero-title {
        font-size: 15vw;
    }

}

</style>
</head>


<body>

<!-- METALLIC IMAGE -->
<div class="metal-background"></div>


<!-- MOVING BLOBS -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>


<!-- SMOKE -->
<div class="smoke smoke-1"></div>
<div class="smoke smoke-2"></div>


<!-- DARK EDGES -->
<div class="vignette"></div>


<!-- TEMPORARY TEXT -->
<div class="hero-content">
    <h1 class="hero-title">303FERGAL</h1>
</div>

</body>
</html>
