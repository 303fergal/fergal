<div id="liquidMetalBg" style="position:relative; width:100%; height:400px; overflow:hidden; background:#0b0f1e; color:#ff6666; font-family:monospace; font-size:12px; padding:10px;"></div>

<script type="module">
  const box = document.getElementById('liquidMetalBg');
  try {
    const {
      ShaderMount,
      liquidMetalFragmentShader,
      LiquidMetalShapes,
      getShaderColorFromString
    } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders/+esm');

    new ShaderMount(box, liquidMetalFragmentShader, {
      u_colorBack: getShaderColorFromString('#0b0f1e'),
      u_colorTint: getShaderColorFromString('#c9cdd6'),
      u_repetition: 2,
      u_shiftRed: 0.3,
      u_shiftBlue: 0.3,
      u_contour: 0.4,
      u_softness: 0.1,
      u_distortion: 0.07,
      u_angle: 70,
      u_shape: LiquidMetalShapes.diamond,
      u_isImage: false
    });
  } catch (err) {
    box.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
</script>
