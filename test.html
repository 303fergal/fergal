<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Test Liquid Metal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0f1e; height:100vh; overflow:hidden; }
  #liquidMetalBg { position:relative; width:100%; height:100vh; }
  .status { position:fixed; top:10px; left:10px; color:#ff6666; font-family:monospace; font-size:12px; z-index:10; }
</style>
</head>
<body>

<div id="liquidMetalBg"></div>
<div class="status" id="status"></div>

<script type="module">
  const status = document.getElementById('status');
  const box = document.getElementById('liquidMetalBg');
  try {
    const {
      ShaderMount,
      liquidMetalFragmentShader,
      LiquidMetalShapes,
      getShaderColorFromString
    } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders/+esm');

    new ShaderMount(box, liquidMetalFragmentShader, {
      u_colorBack: getShaderColorFromString('#0b0f1e'),
      u_colorTint: getShaderColorFromString('#c9cdd6'),
      u_repetition: 2,
      u_shiftRed: 0.3,
      u_shiftBlue: 0.3,
      u_contour: 0.4,
      u_softness: 0.1,
      u_distortion: 0.07,
      u_angle: 70,
      u_shape: LiquidMetalShapes.diamond,
      u_isImage: false
    });
    status.textContent = 'BERHASIL LOAD';
  } catch (err) {
    status.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
</script>

</body>
</html>
