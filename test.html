<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Test Liquid Metal Final v4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050609; height:100vh; overflow:hidden; }
  #heroTest { position:relative; width:100%; height:100vh; overflow:hidden; }
  #liquidMetalBg { position:absolute; inset:0; }
  .status { position:fixed; top:10px; left:10px; color:#fff; background:#000; padding:6px 10px; font-family:monospace; font-size:11px; z-index:20; }

  .glass-shard{
    position:absolute; z-index:2;
    background:linear-gradient(135deg, rgba(255,255,255,.22), rgba(180,190,215,.04));
    border:1px solid rgba(255,255,255,.18);
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.25);
  }
  .gs1{ width:130px; height:170px; top:8%; left:6%;
    clip-path: polygon(22% 0%, 100% 18%, 78% 100%, 0% 62%);
    transform: rotate(-8deg); }
  .gs2{ width:90px; height:130px; bottom:12%; right:10%;
    clip-path: polygon(0% 10%, 70% 0%, 100% 75%, 30% 100%);
    transform: rotate(14deg); background:linear-gradient(135deg, rgba(140,160,220,.18), rgba(20,25,45,.05)); }
  .gs3{ width:60px; height:110px; top:22%; right:20%;
    clip-path: polygon(50% 0%, 100% 40%, 60% 100%, 0% 55%);
    transform: rotate(30deg); }
  .gs4{ width:70px; height:95px; bottom:8%; left:26%;
    clip-path: polygon(15% 0%, 100% 20%, 80% 100%, 0% 80%);
    transform: rotate(-20deg); background:linear-gradient(135deg, rgba(140,160,220,.16), rgba(20,25,45,.04)); }
</style>
</head>
<body>

<div id="heroTest">
  <div id="liquidMetalBg"></div>
  <div class="glass-shard gs1"></div>
  <div class="glass-shard gs2"></div>
  <div class="glass-shard gs3"></div>
  <div class="glass-shard gs4"></div>
</div>

<div class="status" id="status">Loading...</div>

<script type="module">
  const status = document.getElementById('status');
  const box = document.getElementById('liquidMetalBg');
  try {
    const {
      ShaderMount,
      liquidMetalFragmentShader,
      LiquidMetalShapes,
      getShaderColorFromString
    } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders/+esm');

    new ShaderMount(box, liquidMetalFragmentShader, {
      u_colorBack: getShaderColorFromString('#0b0f1e'),
      u_colorTint: getShaderColorFromString('#c8ccd6'),
      u_repetition: 5,
      u_shiftRed: 0.05,
      u_shiftBlue: -0.05,
      u_contour: 0.5,
      u_softness: 0.25,
      u_distortion: 0.12,
      u_angle: 70,
      u_shape: LiquidMetalShapes.metaballs,
      u_isImage: false
    });

    status.textContent = 'BERHASIL LOAD — perhatikan 5-10 detik, jangan langsung screenshot';
  } catch (err) {
    status.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
</script>

</body>
</html>
