<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303FERGAL TEST</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030405;
}

.hero {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background:
        url("Assets/metal-background.jpeg")
        center center / cover
        no-repeat;
}

/* DARK OVERLAY */

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.18);
    z-index: 5;
    pointer-events: none;
}


/* =========================
   MOVING BLOBS
   ========================= */

.blob {
    position: absolute;
    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.95) 0%,
            rgba(210,215,220,.75) 20%,
            rgba(80,85,92,.35) 48%,
            rgba(0,0,0,.0) 72%
        );

    filter: blur(28px);

    mix-blend-mode: screen;

    pointer-events: none;

    z-index: 2;
}


/* BLOB 1 */

.blob-one {
    left: -80px;
    top: 15%;

    animation:
        blobMoveOne
        13s
        ease-in-out
        infinite alternate;
}


/* BLOB 2 */

.blob-two {
    right: -100px;
    top: 40%;

    width: 360px;
    height: 360px;

    animation:
        blobMoveTwo
        17s
        ease-in-out
        infinite alternate;
}


/* BLOB 3 */

.blob-three {
    left: 35%;
    bottom: -120px;

    width: 280px;
    height: 280px;

    animation:
        blobMoveThree
        15s
        ease-in-out
        infinite alternate;
}


/* BLOB ANIMATIONS */

@keyframes blobMoveOne {

    from {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    to {
        transform:
            translate3d(180px, 100px, 0)
            scale(1.25);
    }

}


@keyframes blobMoveTwo {

    from {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    to {
        transform:
            translate3d(-160px, -100px, 0)
            scale(1.3);
    }

}


@keyframes blobMoveThree {

    from {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    to {
        transform:
            translate3d(-100px, -180px, 0)
            scale(1.2);
    }

}


/* =========================
   SKULL
   ========================= */

.skull {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(70vw, 430px);

    transform:
        translate(-50%, -50%);

    z-index: 10;

    pointer-events: none;

    animation:
        skullFloat
        7s
        ease-in-out
        infinite alternate;
}


/* SKULL RELIEF / LIGHT */

.skull img {

    display: block;

    width: 100%;
    height: auto;

    filter:

        drop-shadow(
            0 18px 15px rgba(0,0,0,.55)
        )

        drop-shadow(
            0 0 12px rgba(255,255,255,.25)
        )

        contrast(1.08)
        brightness(1.05);

}


/* SKULL MOVEMENT */

@keyframes skullFloat {

    0% {

        transform:
            translate(-50%, -50%)
            translate3d(-12px, 10px, 0)
            rotate(-2deg)
            scale(1);

    }

    50% {

        transform:
            translate(-50%, -50%)
            translate3d(10px, -12px, 0)
            rotate(1deg)
            scale(1.025);

    }

    100% {

        transform:
            translate(-50%, -50%)
            translate3d(-5px, 8px, 0)
            rotate(2deg)
            scale(1.04);

    }

}


/* =========================
   TITLE
   ========================= */

.title {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(42px, 10vw, 100px);

    font-weight: 700;

    white-space: nowrap;

    text-shadow:
        0 3px 15px rgba(0,0,0,.6);

}

</style>
</head>


<body>

<div class="hero">

    <!-- MOVING BLOBS -->

    <div class="blob blob-one"></div>

    <div class="blob blob-two"></div>

    <div class="blob blob-three"></div>


    <!-- MOVING SKULL -->

    <div class="skull">

        <img
            src="Assets/Untitled193_20260817045750.png"
            alt=""
        >

    </div>


    <!-- TITLE -->

    <div class="title">
        303FERGAL
    </div>

</div>

</body>
</html>
