<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Test Liquid Metal Final</title>
<link rel="stylesheet" href="style.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050609; height:100vh; overflow:hidden; }
  #heroTest { position:relative; width:100%; height:100vh; overflow:hidden; }
  #liquidMetalBg { position:absolute; inset:0; }
  .status { position:fixed; top:10px; left:10px; color:#fff; background:#000; padding:6px 10px; font-family:monospace; font-size:11px; z-index:20; }
</style>
</head>
<body>

<div id="heroTest">
  <div id="liquidMetalBg"></div>

  <!-- pecahan kaca, pakai class shard yang udah ada di style.css -->
  <div class="shard s-chrome" style="width:140px; height:140px; top:10%; left:8%; transform:rotate(18deg); z-index:2; position:absolute;"></div>
  <div class="shard s-navy" style="width:100px; height:100px; bottom:15%; right:12%; transform:rotate(-24deg); z-index:2; position:absolute;"></div>
  <div class="shard blade s-chrome" style="width:22px; height:130px; top:20%; right:20%; transform:rotate(35deg); z-index:2; position:absolute;"></div>
  <div class="shard blade s-navy" style="width:18px; height:100px; bottom:10%; left:25%; transform:rotate(-15deg); z-index:2; position:absolute;"></div>
</div>

<div class="status" id="status">Loading...</div>

<script type="module">
  const status = document.getElementById('status');
  const box = document.getElementById('liquidMetalBg');
  try {
    const {
      ShaderMount,
      liquidMetalFragmentShader,
      LiquidMetalShapes,
      getShaderColorFromString
    } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders/+esm');

    new ShaderMount(box, liquidMetalFragmentShader, {
      u_colorBack: getShaderColorFromString('#0b0f1e'),
      u_colorTint: getShaderColorFromString('#c8ccd6'),
      u_repetition: 5,
      u_shiftRed: 0.05,
      u_shiftBlue: -0.05,
      u_contour: 0.5,
      u_softness: 0.25,
      u_distortion: 0.12,
      u_angle: 70,
      u_shape: LiquidMetalShapes.metaballs,
      u_isImage: false,
      u_scale: 1.3,
      u_speed: 1.2
    });
    status.textContent = 'BERHASIL LOAD';
  } catch (err) {
    status.textContent = 'ERROR: ' + err.message;
    console.error(err);
  }
</script>

</body>
</html>
